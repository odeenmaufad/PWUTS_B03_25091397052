<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Card / Canvas -->
  <rect width="600" height="400" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Subtle decorative Islamic star pattern in background -->
  <g opacity="0.15" stroke="#059669" stroke-width="1.5" fill="none">
    <circle cx="100" cy="80" r="40"/>
    <rect x="72" y="52" width="56" height="56" transform="rotate(45 100 80)"/>
    <circle cx="500" cy="100" r="50"/>
    <rect x="465" y="65" width="70" height="70" transform="rotate(45 500 100)"/>
  </g>

  <!-- Ground Lawn -->
  <ellipse cx="300" cy="380" rx="340" ry="80" fill="#a7f3d0"/>
  <ellipse cx="300" cy="390" rx="300" ry="60" fill="#6ee7b7"/>

  <!-- Main School Building Group -->
  <g filter="url(#softShadow)">
    <!-- Central Building Base -->
    <rect x="180" y="160" width="240" height="170" rx="6" fill="url(#wallGrad)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Central Islamic Arch Portal -->
    <path d="M260,330 L260,240 C260,205 340,205 340,240 L340,330 Z" fill="#047857"/>
    <!-- Portal Door Inside -->
    <path d="M272,330 L272,250 C272,225 328,225 328,250 L328,330 Z" fill="#064e3b"/>
    <line x1="300" y1="235" x2="300" y2="330" stroke="#fbbf24" stroke-width="2"/>

    <!-- Left Wing -->
    <rect x="100" y="200" width="85" height="130" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="115" y="225" width="22" height="35" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="150" y="225" width="22" height="35" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="115" y="275" width="22" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="150" y="275" width="22" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

    <!-- Right Wing -->
    <rect x="415" y="200" width="85" height="130" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="428" y="225" width="22" height="35" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="463" y="225" width="22" height="35" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="428" y="275" width="22" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <rect x="463" y="275" width="22" height="35" rx="3" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>

    <!-- Roof parapet -->
    <rect x="95" y="192" width="95" height="10" rx="3" fill="#047857"/>
    <rect x="410" y="192" width="95" height="10" rx="3" fill="#047857"/>
    <rect x="175" y="152" width="250" height="12" rx="4" fill="#047857"/>

    <!-- Center Dome -->
    <path d="M220,152 C220,70 380,70 380,152 Z" fill="url(#domeGrad)" stroke="#047857" stroke-width="2"/>
    <!-- Dome Crescent & Star Finial -->
    <line x1="300" y1="70" x2="300" y2="35" stroke="#fbbf24" stroke-width="3"/>
    <path d="M300,32 A8,8 0 1,1 306,44 A10,10 0 1,0 300,32 Z" fill="url(#goldGradHero)"/>

    <!-- Left & Right Small Minaret Domes -->
    <path d="M125,192 C125,160 160,160 160,192 Z" fill="url(#domeGrad)"/>
    <line x1="142.5" y1="160" x2="142.5" y2="148" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="142.5" cy="146" r="3" fill="#fbbf24"/>

    <path d="M440,192 C440,160 475,160 475,192 Z" fill="url(#domeGrad)"/>
    <line x1="457.5" y1="160" x2="457.5" y2="148" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="457.5" cy="146" r="3" fill="#fbbf24"/>

    <!-- Center Upper Windows (Islamic Arch Style) -->
    <path d="M225,200 C225,185 245,185 245,200 L245,225 L225,225 Z" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <path d="M355,200 C355,185 375,185 375,200 L375,225 L355,225 Z" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    
    <!-- School Clock / Medallion -->
    <circle cx="300" cy="180" r="16" fill="#ffffff" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="300" y1="180" x2="300" y2="171" stroke="#064e3b" stroke-width="1.5"/>
    <line x1="300" y1="180" x2="307" y2="180" stroke="#064e3b" stroke-width="1.5"/>
  </g>

  <!-- Trees & Greenery on sides -->
  <g>
    <!-- Left Tree -->
    <rect x="68" y="280" width="10" height="50" rx="3" fill="#78350f"/>
    <circle cx="73" cy="260" r="28" fill="#10b981"/>
    <circle cx="63" cy="245" r="20" fill="#34d399"/>
    <circle cx="83" cy="248" r="18" fill="#059669"/>

    <!-- Right Tree -->
    <rect x="522" y="280" width="10" height="50" rx="3" fill="#78350f"/>
    <circle cx="527" cy="260" r="28" fill="#10b981"/>
    <circle cx="517" cy="245" r="20" fill="#34d399"/>
    <circle cx="537" cy="248" r="18" fill="#059669"/>
  </g>

  <!-- Floating Academic Elements (Stack of Books & Knowledge Light) -->
  <g transform="translate(420, 290)">
    <rect x="0" y="20" width="70" height="12" rx="3" fill="#047857"/>
    <rect x="4" y="9" width="62" height="11" rx="2" fill="#fbbf24"/>
    <rect x="8" y="0" width="54" height="10" rx="2" fill="#0284c7"/>
    <!-- Pencil -->
    <polygon points="62,0 72,-10 75,-7 65,3" fill="#f59e0b"/>
    <polygon points="62,0 60,3 65,3" fill="#1e293b"/>
  </g>
</svg>
